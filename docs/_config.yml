# Site settings
title: Hibridon user manual
description: The user documentation for Hibridon
baseurl: "/hibridon" # the subpath of your site, e.g., /blog
url: "https://hibridon.github.io" # the base hostname & protocol for your site

# Build settings
markdown: kramdown
kramdown:
  syntax_highlighter: rouge
  math_engine: mathjax

theme: jekyll-theme-minimal # or any other Jekyll theme you prefer

# Options for Jekyll plugins
plugins:
  - jekyll-feed
  - jekyll-seo-tag

# Exclude from processing.
# The following items will not be processed, by default.
# Any item listed under the `exclude:` key here will be automatically added to
# the internal "default list".
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
